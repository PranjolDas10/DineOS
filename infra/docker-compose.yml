# Local dev stack. Dev-only credentials; real secrets never go in this file.
name: dineos

# Settings shared by every container that runs the backend image.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://dineos_app:dineos_app@postgres:5432/dineos
  # Dev-only default; any real deployment sets its own.
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
  AWS_ACCESS_KEY_ID: dev
  AWS_SECRET_ACCESS_KEY: dev
  AWS_DEFAULT_REGION: us-east-1
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: dineos
      POSTGRES_PASSWORD: dineos
      POSTGRES_DB: dineos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineos -d dineos"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Rate-limit buckets (and later cache). Nothing persistent: no volume.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  # S3-compatible storage for receipt photos (SeaweedFS; MinIO no longer publishes free images).
  # Same boto3 code works against AWS S3. No auth configured: dev only, bound to localhost.
  seaweedfs:
    image: chrislusf/seaweedfs
    command: ["server", "-s3", "-dir=/data"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3data:/data

  # One-shot: creates the uploads bucket (no-op if it exists), retrying until storage is up.
  storage-init:
    build: ../backend
    command: ["python", "-m", "app.storage"]
    environment: *backend-env
    depends_on:
      - seaweedfs

  # One-shot: applies migrations as the owner role, then exits. The API starts only after it succeeds.
  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
      MIGRATION_DATABASE_URL: postgresql+asyncpg://dineos:dineos@postgres:5432/dineos
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ../backend
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dashboard. Talks to the API over the Compose network; tokens stay in its httpOnly cookies.
  web:
    build: ../web
    environment:
      API_URL: http://api:8000
      DEMO_LOGIN: ${DEMO_LOGIN:-0}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Background jobs (receipt parsing). Scale with: docker compose up --scale worker=3
  worker:
    build: ../backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      # Empty means parse jobs fail and retry with backoff until a key is set.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  s3data:
