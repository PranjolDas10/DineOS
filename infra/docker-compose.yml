# Local dev stack. Dev-only credentials; real secrets never go in this file.
name: dineos

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: dineos
      POSTGRES_PASSWORD: dineos
      POSTGRES_DB: dineos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineos -d dineos"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://dineos:dineos@postgres:5432/dineos
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
