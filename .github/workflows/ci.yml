name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dineos
          POSTGRES_PASSWORD: dineos
          POSTGRES_DB: dineos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dineos -d dineos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://dineos_app:dineos_app@localhost:5432/dineos
      MIGRATION_DATABASE_URL: postgresql+asyncpg://dineos:dineos@localhost:5432/dineos
      JWT_SECRET: ci-only-insecure-jwt-secret-0123456789abcdef
      # Only used to sign presigned URLs locally; CI never talks to S3 or the Claude API.
      AWS_ACCESS_KEY_ID: ci-dummy
      AWS_SECRET_ACCESS_KEY: ci-dummy
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      # Same role script Compose runs on a fresh volume.
      - run: psql postgresql://dineos:dineos@localhost:5432/dineos -f ../infra/postgres/init/01-app-role.sql
      - run: uv run alembic upgrade head
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Regenerate tokens.css (and run its contrast check); fail if the committed file drifted.
      - run: npm run tokens && git diff --exit-code -- src/app/tokens.css
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # The web app against a real, seeded API: sign-in, axe in both themes, a full receipt review.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dineos
          POSTGRES_PASSWORD: dineos
          POSTGRES_DB: dineos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dineos -d dineos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://dineos_app:dineos_app@localhost:5432/dineos
      MIGRATION_DATABASE_URL: postgresql+asyncpg://dineos:dineos@localhost:5432/dineos
      JWT_SECRET: ci-only-insecure-jwt-secret-0123456789abcdef
      AWS_ACCESS_KEY_ID: ci-dummy
      AWS_SECRET_ACCESS_KEY: ci-dummy
      AWS_DEFAULT_REGION: us-east-1
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Service containers can't take a command, so storage starts here.
      - run: docker run -d -p 8333:8333 chrislusf/seaweedfs server -s3 -dir=/data
      - run: psql postgresql://dineos:dineos@localhost:5432/dineos -f infra/postgres/init/01-app-role.sql
      - working-directory: backend
        run: |
          uv sync --locked
          uv run alembic upgrade head
          uv run python -m app.seed
          uv run uvicorn app.main:app --port 8000 &
      - working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build backend
      - run: docker build web
