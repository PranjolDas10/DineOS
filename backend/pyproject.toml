[project]
name = "dineos-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30",
    "boto3>=1.43.118",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "tzdata>=2026.5",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "import-linter>=2.15",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
# Explicit so import order is the same whether ruff runs from backend/ (CI) or repo root (pre-commit).
known-first-party = ["app"]

[tool.mypy]
strict = true
files = ["app", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# boto3 ships no type hints; its calls are wrapped in app/receipts/storage.py.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Modules talk only through each other's service.py"
type = "independence"
# Add each new module here.
modules = [
    "app.alerts",
    "app.auth",
    "app.checklists",
    "app.inventory",
    "app.menu",
    "app.receipts",
    "app.scheduling",
]
ignore_imports = ["app.** -> app.*.service"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
